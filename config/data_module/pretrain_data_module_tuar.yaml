#
# Self-supervised pretraining on the TUAR *train* split only (signals X, labels
# ignored: finetune=False). val.h5 / test.h5 are left untouched for fine-tuning
# evaluation, so there is no leakage. The pretraining val set is a random 10%
# of train.h5, used only to monitor reconstruction loss.
data_module:
  _target_: 'data_module.pretrain_data_module.PretrainDataModule'
  name: "eeg_tuar_pretrain"
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}
  test: null
  train_val_split_ratio: 0.9
  datasets:
    tuar_train:
      _target_: 'datasets.hdf5_dataset.HDF5Loader'
      finetune: False
      hdf5_file: '${env:DATA_PATH}/TUAR_data/train.h5'
