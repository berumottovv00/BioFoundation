#
# TUAR fine-tuning data (same layout as finetune_data_module.yaml, which points
# to TUAB). Expected under ${DATA_PATH}/TUAR_data/: train.h5 / val.h5 / test.h5,
# each with groups holding X (N, 22, 1280) and y (N,). The copy used here has
# binary labels (0 = no artifact, 1 = artifact), i.e. classification_type "bc".
data_module:
  _target_: data_module.finetune_data_module.FinetuneDataModule
  name: "eeg_tuar"
  cfg:
    num_workers: ${num_workers}
    batch_size: ${batch_size}
  train:
    _target_: 'datasets.hdf5_dataset.HDF5Loader'
    hdf5_file: '${env:DATA_PATH}/TUAR_data/train.h5'
  val:
    _target_: 'datasets.hdf5_dataset.HDF5Loader'
    hdf5_file: '${env:DATA_PATH}/TUAR_data/val.h5'
  test:
    _target_: 'datasets.hdf5_dataset.HDF5Loader'
    hdf5_file: '${env:DATA_PATH}/TUAR_data/test.h5'
