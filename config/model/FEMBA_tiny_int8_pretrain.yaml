#
# FEMBA_tiny INT8 for quantization-aware pretraining (QAP): Brevitas INT8
# encoder (ARES FEMBATinyInt8) + FP32 reconstruction decoder, see
# models/FEMBA_int8.py. Same sizing as FEMBA_tiny_pretrain.yaml; no
# num_classes because this model only has the reconstruction head.
# Does not need mamba_ssm (quantized Mamba is pure PyTorch), only brevitas.
model:
  _target_: models.FEMBA_int8.FEMBATinyInt8Pretrain
  seq_length: 1280
  num_channels: 22
  exp: 4
  num_blocks: 2
  embed_dim: 35
